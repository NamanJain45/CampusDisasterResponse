name: Pre-Mesh CI

on:
  push:
    branches: [main, pre-mesh-mvp-batch]
  pull_request:
    branches: [main, pre-mesh-mvp-batch]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-disaster-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: campus-disaster-backend/package-lock.json
      - run: npm ci
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug --no-daemon
